name: Bug report
description: Report a reproducible problem with NovelClaw
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please submit issues about using or developing NovelClaw. Abusive, duplicate, or unrelated reports may be closed and reported.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: This issue concerns NovelClaw and contains no spam, advertising, or harassment.
          required: true
        - label: I searched existing issues for this problem.
          required: true
        - label: I will provide reproduction steps and keep the discussion focused on the issue.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem and the behavior you expected.
      placeholder: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps another person can follow.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, Python or Node version, deployment method, browser, and relevant dependencies.
      placeholder: |
        OS:
        Python/Node:
        NovelClaw version/commit:
        Deployment:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove private information before attaching logs or screenshots.
      render: shell
    validations:
      required: false
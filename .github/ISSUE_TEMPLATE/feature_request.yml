name: Feature request
description: Suggest a feature directly related to NovelClaw
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please submit only concrete and discussable feature requests. Irrelevant, duplicate, abusive, spam, or malicious content may be closed, locked, deleted, and reported to GitHub.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-submission checklist
      options:
        - label: I confirm this issue is directly related to NovelClaw and is not spam, harassment, advertising, or an unrelated discussion.
          required: true
        - label: I have searched existing issues and did not find the same request.
          required: true
        - label: I will keep the discussion focused on the feature request and will not post personal attacks or unrelated content.
          required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Explain the specific problem this feature would solve.
      placeholder: What limitation or use case are you trying to address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you would like NovelClaw to improve.
      placeholder: What behavior should be added or changed?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: If you have considered other approaches, describe them here.
    validations:
      required: false
{% macro options() %}<option value="chat">This chat</option><option value="premise">Story Premise</option><option value="author_brief">Author Brief</option><option value="chapter">Use for this chapter</option><option value="character">Character</option><option value="world">World</option>{% endmacro %}
{% macro actions(msg, session_id, n) %}{% for row in msg.scoped_answers or [] %}<small>{% if row.kind == 'chapter' %}Direction for Chapter {{ row.chapter }}{% else %}<a href="{{ app_path('/console/chat/' ~ session_id ~ '/answers/' ~ n ~ '/' ~ loop.index0) }}">Review {{ row.kind }} detail</a>{% endif %}</small>{% endfor %}{% endmacro %}
